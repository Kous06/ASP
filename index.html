<html lang="fr">
<head>
<meta charset="UTF-8">

<title>Future Me</title>

<style>
:root{
  --bg:#08070C;
  --surface:rgba(255,255,255,.045);
  --surface-solid:#131218;
  --surface-2:rgba(255,255,255,.07);
  --line:rgba(255,255,255,.10);
  --text:#F5F3EF;
  --muted:#918F97;
  --muted-2:#5E5C64;
  --past:#D8B685;
  --past-soft:rgba(216,182,133,.16);
  --future:#8C99E8;
  --future-soft:rgba(140,153,232,.16);
  --danger:#E38B8B;
  --ff-serif:'Fraunces',serif;
  --ff-sans:'Inter',sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:var(--ff-sans);height:100%;overflow-x:hidden;}
body{-webkit-font-smoothing:antialiased;}
button,input,textarea{font-family:inherit;}
@media(prefers-reduced-motion:reduce){*{animation-duration:.001ms !important;transition-duration:.001ms !important;}}

#bgcanvas{position:fixed;inset:0;z-index:0;pointer-events:none;}
.nebula{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;}
.nebula span{position:absolute;border-radius:50%;filter:blur(70px);opacity:.55;mix-blend-mode:screen;}
.nebula .n1{width:340px;height:340px;background:radial-gradient(circle,var(--past),transparent 70%);top:-90px;left:-90px;animation:drift1 26s ease-in-out infinite;}
.nebula .n2{width:380px;height:380px;background:radial-gradient(circle,var(--future),transparent 70%);bottom:-120px;right:-100px;animation:drift2 32s ease-in-out infinite;}
@keyframes drift1{0%,100%{transform:translate(0,0)}50%{transform:translate(40px,60px)}}
@keyframes drift2{0%,100%{transform:translate(0,0)}50%{transform:translate(-50px,-40px)}}

#stage{max-width:430px;margin:0 auto;min-height:100vh;min-height:100dvh;position:relative;z-index:1;display:flex;flex-direction:column;}
.screen{flex:1;display:flex;flex-direction:column;padding:28px 24px calc(28px + env(safe-area-inset-bottom));animation:enter .5s cubic-bezier(.2,.8,.2,1);}
@keyframes enter{from{opacity:0;transform:translateY(10px) scale(.99);filter:blur(4px)}to{opacity:1;transform:none;filter:blur(0)}}

.serif{font-family:var(--ff-serif);}
h1.brand{font-family:var(--ff-serif);font-weight:400;font-size:2.3rem;letter-spacing:.01em;margin:0;
  background:linear-gradient(100deg,var(--past),#F5EFE3 35%,var(--future) 70%,var(--past));
  background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;
  animation:sheen 9s ease-in-out infinite;}
@keyframes sheen{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
.tagline{color:var(--muted);font-size:1rem;margin-top:8px;font-family:var(--ff-serif);font-style:italic;font-weight:300;}
.eyebrow{color:var(--muted-2);font-size:.8rem;margin-bottom:2px;}
p{line-height:1.55;}
.muted{color:var(--muted);}
.center{text-align:center;}

.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:16px 20px;border-radius:16px;border:none;font-size:1rem;font-weight:500;cursor:pointer;transition:transform .15s ease, box-shadow .3s ease;}
.btn:active{transform:scale(.96);}
.btn-primary{background:linear-gradient(135deg,#E4C594,var(--past));color:#171009;box-shadow:0 4px 24px rgba(216,182,133,.22);}
.btn-primary:hover{box-shadow:0 6px 30px rgba(216,182,133,.36);}
.btn-ghost{background:var(--surface);color:var(--text);border:1px solid var(--line);backdrop-filter:blur(16px);}
.btn-ghost:hover{border-color:var(--future);}
.btn-text{background:none;border:none;color:var(--muted);font-size:.92rem;cursor:pointer;padding:10px;}
.btn-text:hover{color:var(--text);}
.btn-danger{background:transparent;color:var(--danger);border:1px solid rgba(227,139,139,.35);}
.btn-row{display:flex;gap:10px;}

.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px;}
.iconbtn{width:38px;height:38px;border-radius:50%;background:var(--surface);border:1px solid var(--line);color:var(--text);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:1.05rem;backdrop-filter:blur(16px);transition:transform .15s;}
.iconbtn:active{transform:scale(.9);}

.glass{background:var(--surface);border:1px solid var(--line);backdrop-filter:blur(20px);border-radius:20px;}

.home-hero{margin:14px 0 28px;}
.section-title{font-size:.8rem;letter-spacing:.04em;color:var(--muted-2);margin:30px 0 12px;}
.capsule-row{display:flex;align-items:center;gap:14px;padding:15px;margin-bottom:10px;border-radius:18px;cursor:pointer;background:var(--surface);border:1px solid var(--line);backdrop-filter:blur(16px);transition:transform .15s,border-color .2s;}
.capsule-row:active{transform:scale(.98);}
.capsule-row:hover{border-color:var(--future);}

.capsule-info{flex:1;min-width:0;}
.capsule-title{font-size:.97rem;}
.capsule-sub{color:var(--muted);font-size:.83rem;margin-top:2px;}

.type-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:20px;}

.type-label{font-size:.92rem;}

.capture-area{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;}
video.preview,#photoCanvas{width:100%;border-radius:18px;background:#000;max-height:60vh;object-fit:cover;}
audio.audiopreview{width:100%;}
textarea.textcapture{width:100%;min-height:220px;background:var(--surface);border:1px solid var(--line);backdrop-filter:blur(16px);border-radius:16px;color:var(--text);padding:16px;font-family:var(--ff-serif);font-size:1.15rem;line-height:1.6;resize:vertical;}
textarea.textcapture:focus{outline:none;border-color:var(--future);}
.rec-timer{font-family:var(--ff-serif);font-size:1.1rem;color:var(--past);}

.capbtn::after{content:'';position:absolute;inset:6px;border-radius:50%;background:var(--danger);transition:.2s;}

.lock-scene{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;text-align:center;}
.orb-big{width:120px;height:120px;border-radius:50%;border:2px solid var(--future);position:relative;display:flex;align-items:center;justify-content:center;font-size:2.2rem;animation:seal 1.1s ease forwards;background:radial-gradient(circle,var(--future-soft),transparent 70%);}
@keyframes seal{0%{transform:scale(1.35);opacity:.2}55%{transform:scale(.92);box-shadow:0 0 50px rgba(140,153,232,.4)}100%{transform:scale(1);box-shadow:0 0 22px rgba(140,153,232,.22)}}

.open-scene{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;animation:enter .7s ease;position:relative;}

.burst{position:absolute;width:10px;height:10px;border-radius:50%;background:radial-gradient(circle,rgba(216,182,133,.9),transparent 70%);animation:burst 1.1s ease-out forwards;}
@keyframes burst{0%{transform:scale(1);opacity:.9}100%{transform:scale(38);opacity:0}}
.content-frame{width:100%;margin-top:26px;border-radius:18px;overflow:hidden;}
.letter{background:var(--surface);border:1px solid var(--line);backdrop-filter:blur(16px);border-radius:18px;padding:26px 22px;font-family:var(--ff-serif);font-size:1.15rem;line-height:1.75;white-space:pre-wrap;}
img.immersive{width:100%;border-radius:18px;display:block;}
.question-block{margin-top:26px;padding:20px;background:var(--surface);backdrop-filter:blur(16px);border-radius:16px;border:1px solid var(--line);}
.question-block .qlabel{color:var(--muted-2);font-size:.78rem;margin-bottom:8px;letter-spacing:.03em;}
.question-block .qtext{font-family:var(--ff-serif);font-size:1.1rem;font-style:italic;}

.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px;}
.stat-box{background:var(--surface);border:1px solid var(--line);backdrop-filter:blur(16px);border-radius:16px;padding:18px;}
.stat-num{font-family:var(--ff-serif);font-size:1.7rem;}
.stat-label{color:var(--muted);font-size:.8rem;margin-top:4px;}
.timeline{margin-top:30px;position:relative;padding-left:22px;}
.timeline::before{content:'';position:absolute;left:5px;top:6px;bottom:6px;width:1px;background:var(--line);}
.tl-item{position:relative;padding-bottom:22px;cursor:pointer;}
.tl-dot{position:absolute;left:-22px;top:3px;width:11px;height:11px;border-radius:50%;background:var(--surface-2);border:1px solid var(--muted-2);}
.tl-dot.open{background:var(--past);border-color:var(--past);}
.tl-dot.locked{background:var(--future);border-color:var(--future);}

.tl-date{color:var(--muted);font-size:.78rem;margin-top:2px;}

.ob-slide{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px;}
.ob-dots{display:flex;gap:8px;justify-content:center;margin:24px 0;}
.ob-dot{width:6px;height:6px;border-radius:50%;background:var(--line);}
.ob-dot.active{background:var(--past);width:18px;border-radius:3px;transition:.3s;}
.auth-orb{width:74px;height:74px;border-radius:50%;margin:0 auto 6px;background:conic-gradient(from 180deg,var(--past),var(--future),var(--past));animation:spin 6s linear infinite;display:flex;align-items:center;justify-content:center;}
.auth-orb::after{content:'🕰️';font-size:1.6rem;background:var(--bg);width:60px;height:60px;border-radius:50%;display:flex;align-items:center;justify-content:center;}

.sharecard{aspect-ratio:4/5;width:100%;border-radius:22px;background:linear-gradient(160deg,#171310,#08070C 60%);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px;padding:30px;position:relative;overflow:hidden;}
.sharecard::before{content:'';position:absolute;width:220px;height:220px;background:radial-gradient(circle,var(--future-soft),transparent 70%);top:-60px;right:-60px;}
.sharecard .sc-orb{font-size:2rem;}
.sharecard .sc-text{font-family:var(--ff-serif);font-size:1.3rem;line-height:1.5;position:relative;}
.sharecard .sc-date{color:var(--past);font-size:.85rem;letter-spacing:.03em;position:relative;}

.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--surface-solid);border:1px solid var(--line);padding:12px 20px;border-radius:30px;font-size:.88rem;z-index:999;animation:enter .3s ease;box-shadow:0 8px 30px rgba(0,0,0,.4);}
.hidden{display:none !important;}
.spacer{flex:1;}
.small-note{font-size:.78rem;color:var(--muted-2);margin-top:10px;line-height:1.5;}

.orbit-wrap{display:flex;justify-content:center;margin:6px 0 8px;}
.orbit-system{position:relative;width:264px;height:264px;}
.orbit-center{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:64px;height:64px;border-radius:50%;
  background:radial-gradient(circle,rgba(245,243,239,.14),rgba(245,243,239,.02));border:1px solid var(--line);
  display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font-size:.62rem;color:var(--muted);
  letter-spacing:.03em;z-index:5;cursor:pointer;animation:centerpulse 4s ease-in-out infinite;}
.orbit-center b{font-family:var(--ff-serif);font-size:.82rem;color:var(--text);font-weight:400;display:block;}
@keyframes centerpulse{0%,100%{box-shadow:0 0 0 0 rgba(245,243,239,.08)}50%{box-shadow:0 0 0 10px rgba(245,243,239,0)}}
.orbit-ring{position:absolute;inset:0;animation:spin linear infinite;}
.orbit-ring.reverse{animation-direction:reverse;}
.orbit-track{position:absolute;top:50%;left:50%;width:1px;height:1px;border-radius:50%;}
.orbit-track::before{content:'';position:absolute;border:1px dashed rgba(255,255,255,.06);border-radius:50%;}
.orbit-dot{position:absolute;top:50%;left:50%;width:26px;height:26px;margin:-13px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:.85rem;cursor:pointer;background:var(--future-soft);border:1px solid rgba(140,153,232,.45);}
.orbit-dot.star{background:var(--past-soft);border:1px solid rgba(216,182,133,.4);width:16px;height:16px;margin:-8px;font-size:.55rem;}
.orbit-dot .oicon{animation:spin linear infinite reverse;display:flex;}
.orbit-dot .mood-badge{position:absolute;top:-4px;right:-4px;font-size:.55rem;}
.orbit-empty-hint{position:absolute;top:50%;left:50%;transform:translate(-50%,26px);width:200px;text-align:center;color:var(--muted-2);font-size:.78rem;font-style:italic;font-family:var(--ff-serif);}

.streak-pill{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:20px;background:var(--surface);border:1px solid var(--line);backdrop-filter:blur(16px);font-size:.8rem;color:var(--muted);margin:2px 0 4px;}
.flashback-card{margin-top:18px;padding:16px;border-radius:18px;background:linear-gradient(120deg,var(--past-soft),transparent 70%);border:1px solid rgba(216,182,133,.35);cursor:pointer;display:flex;gap:12px;align-items:center;}
.flashback-card .fb-emoji{font-size:1.4rem;}
.flashback-card .fb-text{font-size:.9rem;line-height:1.4;}

.qc-actions .btn-text{padding:8px;font-size:.82rem;}

.mood-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;}
.mood-chip{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 12px;border-radius:14px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:.68rem;color:var(--muted);min-width:56px;}

.mood-chip.selected{border-color:var(--past);background:var(--past-soft);color:var(--past);}

.modal-box{background:var(--surface-solid);border:1px solid var(--line);border-radius:20px;padding:24px;max-width:340px;width:100%;text-align:center;}
.modal-box p{margin:0 0 20px;font-family:var(--ff-serif);font-size:1.05rem;}

<body>
<canvas id="bgcanvas"></canvas>
<div class="nebula"><span class="n1"></span><span class="n2"></span></div>
<div id="stage"><div id="app"></div></div>

<script>
(function(){
  const cv = document.getElementById('bgcanvas');
  const ctx = cv.getContext('2d');
  let stars=[];
  function resize(){
    cv.width = innerWidth*devicePixelRatio; cv.height = innerHeight*devicePixelRatio;
    cv.style.width=innerWidth+'px'; cv.style.height=innerHeight+'px';
    ctx.scale(devicePixelRatio,devicePixelRatio);
    stars = Array.from({length: Math.min(90, Math.floor(innerWidth*innerHeight/9000))}, ()=>({
      x: Math.random()*innerWidth, y: Math.random()*innerHeight, r: Math.random()*1.3+.2,
      base: Math.random()*.5+.15, speed: Math.random()*.02+.005, phase: Math.random()*Math.PI*2
    }));
  }
  let t=0;
  function draw(){
    ctx.clearRect(0,0,innerWidth,innerHeight);
    t+=1;
    for(const s of stars){
      const a = s.base + Math.sin(t*s.speed + s.phase)*.35;
      ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,7);
      ctx.fillStyle = `rgba(245,243,239,${Math.max(0,a)})`;
      ctx.fill();
    }
    requestAnimationFrame(draw);
  }
  resize(); addEventListener('resize',resize); draw();
})();

function showConfirm(message, {confirmLabel='Supprimer', cancelLabel='Annuler', danger=true}={}){
  return new Promise(resolve=>{
    const back = document.createElement('div'); back.className='modal-back';
    back.innerHTML = `<div class="modal-box"><p>${message}</p>
      <div class="btn-row">
        <button class="btn btn-ghost" id="mCancel">${cancelLabel}</button>
        <button class="btn btn-primary" id="mOk" style="${danger?'background:linear-gradient(135deg,#F0A5A5,var(--danger));color:#2a0d0d':''}">${confirmLabel}</button>
      </div></div>`;
    document.body.appendChild(back);
    const close = (val)=>{ back.remove(); resolve(val); };
    back.querySelector('#mCancel').onclick=()=>close(false);
    back.querySelector('#mOk').onclick=()=>close(true);
    back.onclick=(e)=>{ if(e.target===back) close(false); };
  });
}

const DB_NAME='futureme_db', DB_VER=2;
let dbp = new Promise((resolve,reject)=>{
  const req = indexedDB.open(DB_NAME, DB_VER);
  req.onupgradeneeded = e=>{
    const db = e.target.result;
    if(!db.objectStoreNames.contains('capsules')) db.createObjectStore('capsules',{keyPath:'id'});
    if(!db.objectStoreNames.contains('accounts')){
      const s = db.createObjectStore('accounts',{keyPath:'id'});
      s.createIndex('email','email',{unique:true});
    }
  };
  req.onsuccess = e=>resolve(e.target.result);
  req.onerror = e=>reject(e);
});
function tx(store,mode){ return dbp.then(db=>db.transaction(store,mode).objectStore(store)); }
function dbPut(store,item){ return tx(store,'readwrite').then(s=>new Promise((res,rej)=>{const r=s.put(item);r.onsuccess=()=>res(item);r.onerror=()=>rej(r.error);})); }
function dbGetAll(store){ return tx(store,'readonly').then(s=>new Promise((res,rej)=>{const r=s.getAll();r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);})); }
function dbGet(store,id){ return tx(store,'readonly').then(s=>new Promise((res,rej)=>{const r=s.get(id);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);})); }
function dbDelete(store,id){ return tx(store,'readwrite').then(s=>new Promise((res,rej)=>{const r=s.delete(id);r.onsuccess=()=>res(true);r.onerror=()=>rej(r.error);})); }
function dbGetByIndex(store,index,value){ return tx(store,'readonly').then(s=>new Promise((res,rej)=>{const r=s.index(index).get(value);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);})); }

async function dbAddCapsule(cap){ cap.accountId = getSession(); return dbPut('capsules',cap); }
async function dbAllCapsules(){ const all = await dbGetAll('capsules'); const sid=getSession(); return all.filter(c=>c.accountId===sid).sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt)); }

function fmtDate(d){ return new Date(d).toLocaleDateString('fr-FR',{day:'numeric',month:'long',year:'numeric'}); }
function daysUntil(d){ const diff = new Date(d).setHours(0,0,0,0) - new Date().setHours(0,0,0,0); return Math.ceil(diff/86400000); }
function relOpen(d){ const n=daysUntil(d); if(n<=0) return "Disponible maintenant"; if(n===1) return "Dans 1 jour"; if(n<31) return `Dans ${n} jours`; if(n<62) return "Dans 1 mois"; const m=Math.round(n/30.4); if(m<12) return `Dans ${m} mois`; return n<400?"Dans 1 an":`Dans ${Math.round(n/365)} ans`; }
function relPast(d){ const n = Math.abs(daysUntil(d)); if(n<1) return "aujourd'hui"; if(n===1) return "il y a 1 jour"; if(n<31) return `il y a ${n} jours`; const m=Math.round(n/30.4); if(m<12) return `il y a ${m} mois`; return `il y a ${Math.round(n/365)} an(s)`; }
function toast(msg){ const t=document.createElement('div'); t.className='toast'; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),2400); }
function blobToDataURL(blob){ return new Promise(res=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.readAsDataURL(blob); }); }
function escapeHtml(s){ const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }
async function sha256(msg){ const enc=new TextEncoder().encode(msg); const buf=await crypto.subtle.digest('SHA-256',enc); return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join(''); }
function isValidEmail(e){ return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e); }

function playTone(kind){
  try{
    const Ctx = window.AudioContext||window.webkitAudioContext; if(!Ctx) return;
    const ctx = new Ctx();
    const seq = kind==='lock' ? [[660,0],[440,.09]] : [[440,0],[660,.09],[880,.18]];
    seq.forEach(([freq,delay])=>{
      const o=ctx.createOscillator(), g=ctx.createGain();
      o.type='sine'; o.frequency.value=freq; o.connect(g); g.connect(ctx.destination);
      const t=ctx.currentTime+delay;
      g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(.07,t+.02); g.gain.exponentialRampToValueAtTime(.0001,t+.4);
      o.start(t); o.stop(t+.42);
    });
    setTimeout(()=>ctx.close && ctx.close(), 900);
  }catch(e){}
}

function weekKey(d){ const dt=new Date(d); const onejan=new Date(dt.getFullYear(),0,1); const wk=Math.ceil((((dt-onejan)/86400000)+onejan.getDay()+1)/7); return dt.getFullYear()+'-'+wk; }
function computeStreak(all){
  if(all.length===0) return 0;
  const weeks = new Set(all.map(c=>weekKey(c.createdAt)));
  let streak=0, cursor=new Date();
  while(weeks.has(weekKey(cursor))){ streak++; cursor.setDate(cursor.getDate()-7); }
  return streak;
}
function findFlashback(all){
  const today = new Date();
  for(const c of all){
    const d = new Date(c.createdAt);
    if(d.getMonth()===today.getMonth() && d.getDate()===today.getDate() && d.getFullYear()<today.getFullYear()){
      return {capsule:c, years: today.getFullYear()-d.getFullYear()};
    }
  }
  return null;
}

async function checkDueCapsules(){
  if(!('Notification' in window) || !getSession()) return;
  const all = await dbAllCapsules();
  const due = all.filter(c=> !c.opened && !c.notified && new Date(c.unlockAt) <= new Date());
  if(due.length===0) return;
  for(const c of due){ c.notified=true; await dbPut('capsules',c); }
  if(Notification.permission==='granted'){
    due.forEach(()=> new Notification('Future Me', {body:'🕰️ Ton toi du passé veut te parler.'}) );
  }
}

function ringForDays(n){ if(n<=30) return 'soon'; if(n<=180) return 'later'; return 'far'; }
const RING_RADIUS = {soon:56, later:90, far:124};
const RING_DURATION = {soon:'46s', later:'74s', far:'110s'};
function hashAngle(id){ let h=0; for(let i=0;i<id.length;i++) h=(h*31+id.charCodeAt(i))>>>0; return h%360; }

        <button class="btn btn-ghost" id="fromGallery">📁 Galerie</button>
        <button class="capbtn" id="snap"></button>
        <div style="width:80px"></div>
      </div>
      <input type="file" accept="image/*" id="fileInput" class="hidden">`;
    try{
      mediaStream = await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'}});
      $('#vid').srcObject = mediaStream;
    }catch(e){ area.querySelector('#vid').replaceWith(Object.assign(document.createElement('div'),{className:'muted',textContent:'Caméra indisponible — utilise la galerie.'})); }
    $('#snap').onclick=()=>{
      const v=$('#vid'); const canvas=document.createElement('canvas');
      canvas.width=v.videoWidth||640; canvas.height=v.videoHeight||480;
      canvas.getContext('2d').drawImage(v,0,0,canvas.width,canvas.height);
      canvas.toBlob(b=>{ draft.content=b; stopMedia(); nav('scheduleDate'); }, 'image/jpeg', .9);
    };
    $('#fromGallery').onclick=()=> $('#fileInput').click();
    $('#fileInput').onchange=(e)=>{ const f=e.target.files[0]; if(f){ draft.content=f; stopMedia(); nav('scheduleDate'); } };
    return;
  }

  if(t==='audio'){
    area.innerHTML = `<div style="font-size:3rem">🎙️</div>
      <div class="rec-timer" id="timer">00:00</div>
      <button class="capbtn" id="recBtn"></button>
      <div class="muted small-note">Jusqu\u2019à 2 minutes</div>`;
    try{ mediaStream = await navigator.mediaDevices.getUserMedia({audio:true}); }
    catch(e){ toast('Micro indisponible'); nav('createType'); return; }
    $('#recBtn').onclick=()=> toggleRecording('audio', 120);
    return;
  }

  if(t==='video'){
    area.innerHTML = `<video class="preview" id="vid" autoplay playsinline muted></video>
      <div class="rec-timer" id="timer">00:00</div>
      <button class="capbtn" id="recBtn"></button>
      <div class="muted small-note">Jusqu\u2019à 60 secondes</div>`;
    try{ mediaStream = await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'},audio:true}); $('#vid').srcObject=mediaStream; }
    catch(e){ toast('Caméra indisponible'); nav('createType'); return; }
    $('#recBtn').onclick=()=> toggleRecording('video', 60);
    return;
  }
};

function toggleRecording(kind, maxSec){
  const btn = $('#recBtn'), timerEl = $('#timer');
  if(!mediaRecorder || mediaRecorder.state==='inactive'){
    recChunks=[]; recSeconds=0;
    mediaRecorder = new MediaRecorder(mediaStream);
    mediaRecorder.ondataavailable = e=>{ if(e.data.size) recChunks.push(e.data); };
    mediaRecorder.onstop = ()=>{
      const blob = new Blob(recChunks, {type: kind==='video'?'video/webm':'audio/webm'});
      draft.content = blob;
      nav('scheduleDate');
    };
    mediaRecorder.start();
    btn.classList.add('recording');
    recTimer = setInterval(()=>{
      recSeconds++;
      const m=String(Math.floor(recSeconds/60)).padStart(2,'0'), s=String(recSeconds%60).padStart(2,'0');
      timerEl.innerHTML = `<span class="rec-dot"></span>${m}:${s}`;
      if(recSeconds>=maxSec) mediaRecorder.stop();
    },1000);
  } else {
    mediaRecorder.stop();
    clearInterval(recTimer);
    btn.classList.remove('recording');
  }
}

RENDER.scheduleDate = ()=>{
  const opts = [
    {k:'1w', label:'1 semaine', days:7}, {k:'1m', label:'1 mois', days:30},
    {k:'3m', label:'3 mois', days:91}, {k:'6m', label:'6 mois', days:182},
    {k:'1y', label:'1 an', days:365}, {k:'custom', label:'Date personnalisée'}
  ];
  app.innerHTML = `
  <div class="screen">
    <div class="topbar"><button class="iconbtn" id="back">←</button><div></div><div></div></div>
    <h1 class="serif" style="font-size:1.4rem;font-weight:400">Quand veux-tu que ton futur toi le découvre&nbsp;?</h1>
    <div class="chiprow" id="chips">
      ${opts.map(o=>`<div class="chip" data-k="${o.k}" data-d="${o.days||''}">${o.label}</div>`).join('')}
    </div>
    <input type="date" id="customDate" class="hidden">
    <label class="field-label">Comment tu te sens en écrivant ça ? (facultatif)</label>
    <div class="mood-row" id="moods">
      ${MOODS.map(m=>`<div class="mood-chip" data-k="${m.k}"><span class="me">${m.me}</span>${m.label}</div>`).join('')}
    </div>
    <label class="field-label">Ajoute une question à ton futur toi (facultatif)</label>
    <input type="text" id="question" placeholder="Est-ce que tu es heureux ?">
    <div class="spacer"></div>
    <button class="btn btn-primary" id="lockBtn">Verrouiller la capsule</button>
  </div>`;
  $('#back').onclick=()=> nav('capture');
  let chosenDate=null, chosenMood=null;
  document.querySelectorAll('.mood-chip').forEach(m=> m.onclick=()=>{
    const already = m.classList.contains('selected');
    document.querySelectorAll('.mood-chip').forEach(x=>x.classList.remove('selected'));
    if(!already){ m.classList.add('selected'); chosenMood=m.dataset.k; } else chosenMood=null;
  });
  document.querySelectorAll('.chip').forEach(chip=>{
    chip.onclick=()=>{
      document.querySelectorAll('.chip').forEach(c=>c.classList.remove('selected'));
      chip.classList.add('selected');
      if(chip.dataset.k==='custom'){ $('#customDate').classList.remove('hidden'); $('#customDate').min=new Date(Date.now()+86400000).toISOString().slice(0,10); chosenDate=null; }
      else { $('#customDate').classList.add('hidden'); const d=new Date(); d.setDate(d.getDate()+parseInt(chip.dataset.d)); chosenDate=d.toISOString(); }
    };
  });
  $('#customDate').onchange=(e)=>{ chosenDate = new Date(e.target.value+'T09:00:00').toISOString(); };
  $('#lockBtn').onclick=async ()=>{
    if(!chosenDate){ toast('Choisis une date d\u2019ouverture'); return; }
    draft.unlockAt = chosenDate;
    draft.question = $('#question').value.trim() || null;
    draft.mood = chosenMood;
    draft.opened=false; draft.notified=false;
    if(draft.content instanceof Blob || draft.content instanceof File){
      draft.content = await blobToDataURL(draft.content);
    }
    await dbAddCapsule(draft);
    playTone('lock');
    nav('locking', {date: draft.unlockAt});
  };
};

RENDER.profile = async ()=>{
  const all = await dbAllCapsules();

  app.innerHTML = `
  <div class="screen">

    <h1 class="serif" style="font-size:1.5rem;font-weight:400">${CURRENT_ACCOUNT?.name||'Toi'}</h1>

    <div class="stat-grid">
      <div class="stat-box"><div class="stat-num">${all.length}</div><div class="stat-label">Capsules créées</div></div>
      <div class="stat-box"><div class="stat-num">${opened.length}</div><div class="stat-label">Capsules ouvertes</div></div>
      <div class="stat-box"><div class="stat-num">${locked.length}</div><div class="stat-label">En attente</div></div>
      <div class="stat-box"><div class="stat-num">${sorted[0]?fmtDate(sorted[0].createdAt).split(' ')[2]:'—'}</div><div class="stat-label">Plus ancienne capsule</div></div>
    </div>
    <div class="section-title">TIMELINE</div>
    <div class="timeline" id="tl"></div>
    <div class="spacer"></div>
    <button class="btn btn-ghost" id="logout">Se déconnecter</button>
    <button class="btn-text" id="reset">Réinitialiser mes données locales</button>
  </div>`;
  $('#back').onclick=()=> nav('home');
  const tl=$('#tl');
  if(sorted.length===0) tl.innerHTML='<div class="empty">Ta timeline commencera dès ta première capsule.</div>';
  sorted.forEach(c=>{
    const div=document.createElement('div'); div.className='tl-item';
    div.innerHTML=`<div class="tl-dot ${c.opened?'open':'locked'}"></div>
      <div class="tl-label">${c.opened?'🔓':'📦'} ${c.type==='prediction'?'Prédiction':'Capsule'}</div>
      <div class="tl-date">${fmtDate(c.createdAt)}</div>`;
    div.onclick=()=> c.opened ? nav('capsuleView',{id:c.id}) : nav('capsuleLocked',{id:c.id});
    tl.appendChild(div);
  });
  $('#logout').onclick=async ()=>{
    const ok = await showConfirm('Te déconnecter&nbsp;?', {confirmLabel:'Se déconnecter', danger:false});
    if(ok){ clearSession(); CURRENT_ACCOUNT=null; nav('authChoice'); }
  };
  $('#reset').onclick=async ()=>{
    const ok = await showConfirm('Supprimer toutes tes capsules et ton compte sur cet appareil&nbsp;? Action irréversible.');
    if(!ok) return;
    const items = await dbAllCapsules();
    for(const it of items) await dbDeleteCapsule(it.id);
    if(CURRENT_ACCOUNT) await dbDelete('accounts', CURRENT_ACCOUNT.id);
    clearSession(); CURRENT_ACCOUNT=null;
    toast('Données supprimées');
    nav('authChoice');
  };
};
